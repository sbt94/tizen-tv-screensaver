<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>TV Screensaver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff; cursor: none;
    font-family: "SamsungOne", "Samsung Sans", "Helvetica Neue", Arial, sans-serif;
  }

  /* ---------- Generative art (2 canvases for crossfade) ---------- */
  .art {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity 3s ease-in-out;
  }
  .art.visible { opacity: 1; }
  /* ---------- Photo mode (Chromecast style) ---------- */
  .photo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 2.5s ease-in-out; overflow: hidden; }
  .photo.visible { opacity: 1; }
  .pblur { position: absolute; top: -5%; left: -5%; width: 110%; height: 110%; background-size: cover; background-position: center; filter: blur(50px) brightness(0.5); }
  .pimg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-position: center; background-repeat: no-repeat; }
  .pimg.cover { background-size: cover; animation: kenburns 70s ease-out forwards; }
  .pimg.contain { background-size: contain; top: 4%; height: 92%; }
  @keyframes kenburns { from { transform: scale(1.0) translate(0, 0); } to { transform: scale(1.12) translate(-2%, -1%); } }
  #scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 38%; display: none;
           background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0)); }
  #credit { position: absolute; right: 6%; bottom: 9%; display: none; text-align: right; max-width: 45%;
            unicode-bidi: plaintext; text-shadow: 0 2px 12px rgba(0,0,0,0.6); transition: opacity 1.5s, transform 12s ease-in-out; }
  #creditTitle { font-size: 34px; font-weight: 400; }
  #creditSub { font-size: 24px; opacity: 0.75; margin-top: 6px; }
  body.photomode #scrim, body.photomode #credit { display: block; }
  body.photomode #clock { left: 6% !important; top: auto !important; bottom: 8%; transform: none; text-align: left;
                          transition: transform 12s ease-in-out, opacity 0.8s; }
  body.photomode #time { font-size: 120px; font-weight: 300; }
  body.photomode #time .sec { font-size: 40px; }
  body.photomode #date { font-size: 36px; margin-top: 8px; direction: rtl; text-align: left; unicode-bidi: plaintext; }
  body.photomode #pair { font-size: 24px; }

  #dim { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000; opacity: 0.2; transition: opacity 0.6s; }

  /* ---------- Clock ---------- */
  #clock {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    text-align: center; direction: ltr;
    transition: left 12s ease-in-out, top 12s ease-in-out, color 20s linear, opacity 0.8s;
    text-shadow: 0 4px 30px rgba(0,0,0,0.45);
    white-space: nowrap;
  }
  #time { font-size: 210px; font-weight: 200; letter-spacing: 4px; line-height: 1; }
  #time .sec { font-size: 70px; opacity: 0.6; margin-left: 12px; vertical-align: top; }
  #time .colon { animation: blink 2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #date { margin-top: 18px; font-size: 48px; font-weight: 300; opacity: 0.85; direction: rtl; }
  #pair { margin-top: 26px; font-size: 30px; opacity: 0.7; direction: rtl; }

  /* ---------- Share mode (Telegram) ---------- */
  #share {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% 40%, #24163a 0%, #05040a 75%); opacity: 0; visibility: hidden; overflow: hidden;
    transition: opacity 0.8s, visibility 0.8s;
  }
  #share.on { opacity: 1; visibility: visible; }
  #shareBlur {
    position: absolute; top: -5%; left: -5%; width: 110%; height: 110%;
    background-size: cover; background-position: center;
    filter: blur(40px) brightness(0.45);
  }
  #shareStage {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 10s ease-in-out;
  }
  #shareImg, #shareVideo { width: 100%; height: 100%; object-fit: contain; display: none; }
  #shareText {
    display: none; max-width: 80%; max-height: 92%; overflow: hidden;
    background: rgba(0,0,0,0.55); border-radius: 28px; padding: 60px 80px;
    font-size: 54px; line-height: 1.5; white-space: pre-wrap; text-align: center;
    unicode-bidi: plaintext;
  }
  #shareCaption {
    position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); border-radius: 16px; padding: 14px 36px;
    font-size: 40px; unicode-bidi: plaintext; display: none; max-width: 85%; text-align: center;
  }
  #shareCount { position: absolute; top: 40px; left: 50px; font-size: 26px; opacity: 0.6; direction: ltr; }
  #miniClock { position: absolute; top: 36px; right: 50px; font-size: 40px; opacity: 0.7; direction: ltr; text-shadow: 0 2px 12px #000; }

  /* ---------- Help screen ---------- */
  #help {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 20; direction: rtl;
    background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center;
  }
  #help.open { display: flex; }
  #helpCard { width: 1240px; background: rgba(22,24,32,0.96); border-radius: 28px; padding: 40px 56px; box-shadow: 0 20px 80px rgba(0,0,0,0.6); }
  #helpCard h1 { font-size: 44px; font-weight: 300; margin-bottom: 14px; }
  #helpCard h2 { font-size: 30px; font-weight: 500; margin: 22px 0 6px; opacity: 0.9; }
  .hrow { display: flex; align-items: center; height: 52px; font-size: 28px; }
  .hkey { flex: 0 0 300px; font-weight: 500; direction: ltr; text-align: right; }
  .hdesc { opacity: 0.85; }
  .htext { font-size: 28px; line-height: 1.6; opacity: 0.85; }
  .htext b { font-weight: 500; display: inline-block; direction: ltr; unicode-bidi: isolate; }
  .hclose { margin-top: 22px; font-size: 22px; opacity: 0.55; text-align: center; }

  /* ---------- Toast ---------- */
  #toast {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); border-radius: 16px; padding: 18px 36px;
    font-size: 28px; line-height: 1.6; opacity: 0; transition: opacity 0.5s; text-align: center; direction: rtl; white-space: nowrap;
    z-index: 10;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <canvas class="art" id="artA"></canvas>
  <canvas class="art" id="artB"></canvas>
  <div class="photo" id="phA"><div class="pblur"></div><div class="pimg"></div></div>
  <div class="photo" id="phB"><div class="pblur"></div><div class="pimg"></div></div>
  <div id="dim"></div>
  <div id="scrim"></div>
  <div id="credit"><div id="creditTitle"></div><div id="creditSub"></div></div>

  <div id="clock">
    <div id="time"></div>
    <div id="date"></div>
    <div id="pair"></div>
  </div>

  <div id="share">
    <div id="shareBlur"></div>
    <div id="shareStage">
      <img id="shareImg" alt="">
      <video id="shareVideo" playsinline preload="auto"></video>
      <div id="shareText"></div>
    </div>
    <div id="shareCaption"></div>
    <div id="shareCount"></div>
    <div id="miniClock"></div>
  </div>

  <div id="help">
    <div id="helpCard">
      <h1>איך משתמשים</h1>
      <h2>שלט</h2>
      <div id="helpKeys"></div>
      <h2>שליחה מהטלפון בטלגרם</h2>
      <div class="htext" id="helpBot"></div>
      <div class="hclose">לחצו על כפתור כלשהו לסגירה</div>
    </div>
  </div>

  <div id="toast"></div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';

  /* ======================= Settings ======================= */
  // Secrets and personal settings live in config.js (not committed).
  // Copy config.example.js to config.js and fill it in. Everything is optional.
  var CFG = window.TV_CONFIG || {};
  var BOT_TOKEN        = CFG.BOT_TOKEN || '';          // Telegram bot token from @BotFather
  var ALLOWED_CHAT_IDS = CFG.ALLOWED_CHAT_IDS || [];   // optional; otherwise use /pair <code>
  // Background mode: 'photos' | 'art' | 'mix' | 'live'
  var MODE             = CFG.MODE || 'mix';
  var UNSPLASH_KEY     = CFG.UNSPLASH_KEY || '';       // optional; Wikimedia is used without it
  var UNSPLASH_QUERY   = CFG.UNSPLASH_QUERY || 'landscape nature';
  var FILL_SCREEN      = CFG.FILL_SCREEN !== false;    // true: pictures fill the screen; false: whole picture on a blurred backdrop
  var WIKI_CATEGORIES = ['Featured_pictures_of_landscapes', 'Featured_pictures_of_mountains', 'Featured_pictures_of_coasts',
                         'Featured_pictures_of_volcanoes', 'Featured_pictures_of_islands', 'Featured_pictures_of_landscapes'];
  var WIKI_ART_CATEGORIES = ['Featured_pictures_of_paintings_from_France', 'Featured_pictures_of_paintings_from_Italy',
                             'Featured_pictures_of_paintings_from_Spain', 'Featured_pictures_of_art'];
  var PHOTO_MINUTES      = Math.min(120, Math.max(0.25, Number(CFG.PHOTO_MINUTES) || 1));
  var PHOTO_INTERVAL_MS  = PHOTO_MINUTES * 60 * 1000;   // photo change
  var BG_INTERVAL_MS     = 2 * 60 * 1000;  // live artwork change
  var ART_FPS            = 30;             // lower if the TV struggles
  var MOVE_INTERVAL_MS   = 45 * 1000;      // clock shift (anti burn-in)
  var SHARE_ROTATE_MS    = 20 * 1000;      // rotate between several shared items (videos play to the end)
  var SHARE_SHIFT_MS     = 60 * 1000;      // tiny shift of shared content (anti burn-in)
  var SHARE_MAX_HOURS    = 8;              // auto-return to clock (0 = never)
  var POWER_REFRESH_MS   = 5 * 60 * 1000;

  var CLOCK_COLORS = ['#ffffff', '#f3f6ff', '#fff6ec', '#eefcf6', '#fdf0f6'];
  var DAYS   = ['יום ראשון','יום שני','יום שלישי','יום רביעי','יום חמישי','יום שישי','שבת'];
  var MONTHS = ['בינואר','בפברואר','במרץ','באפריל','במאי','ביוני','ביולי','באוגוסט','בספטמבר','באוקטובר','בנובמבר','בדצמבר'];

  /* ======================= State ======================= */
  var hasTizen = typeof window.tizen !== 'undefined';
  var showSecs = true, paused = false;
  var dim = (function () {               // brightness, remembered separately for live art and for pictures
    var d = { live: 0.2, photo: 0 };
    try { var v = JSON.parse(localStorage.getItem('dim') || '{}'); if (v.live >= 0 && v.live <= 0.8) d.live = v.live; if (v.photo >= 0 && v.photo <= 0.8) d.photo = v.photo; } catch (e) {}
    return d;
  })();
  function applyDim() { $('dim').style.opacity = MODE === 'live' ? dim.live : dim.photo; }
  var artIndex = -1;
  var bgTimer, moveTimer, toastTimer;

  var shareItems = [], shareIndex = 0, shareOn = false;
  var shareRotateTimer, shareShiftTimer, shareMaxTimer;

  var $ = function (id) { return document.getElementById(id); };

  /* ======================= Screen power ======================= */
  function keepScreenOn() {
    if (!hasTizen || !tizen.power) return;
    try { tizen.power.request('SCREEN', 'SCREEN_NORMAL'); }
    catch (e) { console.log('power.request failed: ' + e.message); }
  }
  function releaseScreen() {
    if (!hasTizen || !tizen.power) return;
    try { tizen.power.release('SCREEN'); } catch (e) {}
  }

  /* ======================= Clock ======================= */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function renderClock() {
    var d = new Date();
    var html = pad(d.getHours()) + '<span class="colon">:</span>' + pad(d.getMinutes());
    if (showSecs) html += '<span class="sec">' + pad(d.getSeconds()) + '</span>';
    $('time').innerHTML = html;
    $('date').textContent = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    $('miniClock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function snapClock() {               // reposition at once (no 12-second glide) when the layout changes
    var c = $('clock'), cr = $('credit');
    c.style.transition = cr.style.transition = 'none';
    moveClock();
    void c.offsetWidth;
    c.style.transition = cr.style.transition = '';
  }
  function tick() {
    renderClock();
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  function moveClock() {
    var clock = $('clock');
    if (document.body.classList.contains('photomode')) {      // Chromecast layout: small jitter vs burn-in
      clock.style.transform = 'translate(' + Math.round(rnd(-40, 40)) + 'px,' + Math.round(rnd(-30, 20)) + 'px)';
      $('credit').style.transform = 'translate(' + Math.round(rnd(-40, 40)) + 'px,' + Math.round(rnd(-30, 20)) + 'px)';
      clock.style.color = '#fff';
      return;
    }
    clock.style.transform = '';
    clock.style.left = (30 + Math.random() * 40) + '%';
    clock.style.top  = (28 + Math.random() * 44) + '%';
    clock.style.color = CLOCK_COLORS[Math.floor(Math.random() * CLOCK_COLORS.length)];
  }

  /* ======================= Generative art ======================= */
  var W = 960, H = 540;              // rendered at half-res, scaled up by CSS (fast + soft)
  var TAU = Math.PI * 2;
  var canvases = [$('artA'), $('artB')];
  for (var ci = 0; ci < 2; ci++) { canvases[ci].width = W; canvases[ci].height = H; }
  var activeCanvas = 0, running = [], lastFrame = 0, artStopped = false;

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function hex2rgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgba(h, a) { var c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function mix(h1, h2, t) {
    var a = hex2rgb(h1), b = hex2rgb(h2);
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }
  function offscreen(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function glowSprite(color, r) {
    var c = offscreen(r * 2, r * 2), g = c.getContext('2d');
    var gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, rgba(color, 1)); gr.addColorStop(0.35, rgba(color, 0.45)); gr.addColorStop(1, rgba(color, 0));
    g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
    return c;
  }

  // Perlin noise 2D
  var perm = [];
  (function () {
    var p = [], i;
    for (i = 0; i < 256; i++) p[i] = i;
    for (i = 255; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = p[i]; p[i] = p[j]; p[j] = t; }
    for (i = 0; i < 512; i++) perm[i] = p[i & 255];
  })();
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(t, a, b) { return a + t * (b - a); }
  function grad(h, x, y) { switch (h & 3) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; default: return -x - y; } }
  function noise(x, y) {
    var X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    var u = fade(x), v = fade(y), a = perm[X] + Y, b = perm[X + 1] + Y;
    return lerp(v, lerp(u, grad(perm[a], x, y), grad(perm[b], x - 1, y)),
                   lerp(u, grad(perm[a + 1], x, y - 1), grad(perm[b + 1], x - 1, y - 1)));
  }

  var PALETTES = [
    { name: 'Neon dusk',   bg: '#07040f', c: ['#ff2e88', '#ff9a3c', '#7b2cff', '#00e5ff'] },
    { name: 'Nordic',      bg: '#020812', c: ['#3cffb4', '#2bd9ff', '#8a5cff', '#c6ff6b'] },
    { name: 'Ember',       bg: '#0c0402', c: ['#ff5e1a', '#ffb347', '#ff2d55', '#ffd9a0'] },
    { name: 'Deep sea',    bg: '#010814', c: ['#00b4d8', '#48cae4', '#90e0ef', '#5e60ce'] },
    { name: 'Orchid',      bg: '#0a0410', c: ['#e056fd', '#f78fb3', '#7f5af0', '#ffd6ff'] },
    { name: 'Gold leaf',   bg: '#060505', c: ['#d4a373', '#ffd166', '#f4f1de', '#e76f51'] }
  ];

  var SCENES = [
    /* 1. Silk flow field */
    { name: 'משי', init: function (g, P) {
        g.fillStyle = P.bg; g.fillRect(0, 0, W, H);
        var parts = [];
        for (var i = 0; i < 1100; i++) parts.push({ x: rnd(0, W), y: rnd(0, H), l: rnd(50, 300), c: i % P.c.length });
        return { p: parts, scale: rnd(0.0025, 0.0045), twist: rnd(1.2, 2.4) };
      },
      draw: function (g, S, P, t) {
        g.globalCompositeOperation = 'source-over';
        g.fillStyle = rgba(P.bg, 0.035); g.fillRect(0, 0, W, H);
        g.lineWidth = 1.1; g.globalAlpha = 0.55;
        var o = t * 0.00004;
        for (var c = 0; c < P.c.length; c++) {
          g.strokeStyle = P.c[c]; g.beginPath();
          for (var i = c; i < S.p.length; i += P.c.length) {
            var p = S.p[i];
            var a = noise(p.x * S.scale + o, p.y * S.scale - o) * TAU * S.twist;
            var nx = p.x + Math.cos(a) * 1.6, ny = p.y + Math.sin(a) * 1.6;
            g.moveTo(p.x, p.y); g.lineTo(nx, ny);
            p.x = nx; p.y = ny; p.l--;
            if (p.l < 0 || nx < 0 || nx > W || ny < 0 || ny > H) { p.x = rnd(0, W); p.y = rnd(0, H); p.l = rnd(50, 300); }
          }
          g.stroke();
        }
        g.globalAlpha = 1;
      } },

    /* 2. Aurora over mountains */
    { name: 'זוהר צפוני', init: function (g, P) {
        var sky = offscreen(W, H), s = sky.getContext('2d');
        var gr = s.createLinearGradient(0, 0, 0, H);
        gr.addColorStop(0, '#01020a'); gr.addColorStop(1, mix(P.bg, P.c[3], 0.25));
        s.fillStyle = gr; s.fillRect(0, 0, W, H);
        for (var i = 0; i < 350; i++) { s.fillStyle = 'rgba(255,255,255,' + rnd(0.2, 0.9) + ')'; s.fillRect(rnd(0, W), rnd(0, H * 0.8), rnd(0.6, 1.6), rnd(0.6, 1.6)); }
        var hills = offscreen(W, H), h = hills.getContext('2d');
        for (var L = 0; L < 2; L++) {
          h.fillStyle = L ? '#000' : '#05060b'; h.beginPath(); h.moveTo(0, H);
          for (var x = 0; x <= W; x += 6) h.lineTo(x, H * (0.78 + L * 0.08) - (noise(x * 0.006, L * 7) + 0.5) * (70 - L * 30));
          h.lineTo(W, H); h.fill();
        }
        var rib = [];
        for (var r = 0; r < 3; r++) {
          var sp = offscreen(1, 256), sg = sp.getContext('2d'), lg = sg.createLinearGradient(0, 0, 0, 256), col = P.c[r];
          lg.addColorStop(0, rgba(col, 0)); lg.addColorStop(0.8, rgba(col, 0.5)); lg.addColorStop(0.97, rgba('#ffffff', 0.8)); lg.addColorStop(1, rgba(col, 0));
          sg.fillStyle = lg; sg.fillRect(0, 0, 1, 256);
          rib.push({ sp: sp, base: H * rnd(0.32, 0.55), amp: rnd(60, 130), seed: rnd(0, 100), speed: rnd(0.6, 1.4) });
        }
        return { sky: sky, hills: hills, rib: rib };
      },
      draw: function (g, S, P, t) {
        g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
        g.drawImage(S.sky, 0, 0);
        g.globalCompositeOperation = 'lighter';
        for (var r = 0; r < S.rib.length; r++) {
          var R = S.rib[r];
          for (var x = 0; x < W; x += 3) {
            var y = R.base + noise(x * 0.003 + t * 0.00006 * R.speed, R.seed) * R.amp + Math.sin(x * 0.01 + t * 0.0004) * 14;
            var hh = 110 + 120 * (0.5 + noise(x * 0.012, t * 0.00015 + R.seed));
            g.globalAlpha = Math.max(0, 0.22 + 0.5 * noise(x * 0.02 + t * 0.0003, R.seed + 5));
            g.drawImage(R.sp, x, y - hh, 3, hh);
          }
        }
        g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
        g.drawImage(S.hills, 0, 0);
      } },

    /* 3. Bokeh light orbs */
    { name: 'אורות', init: function (g, P) {
        var bg = offscreen(W, H), b = bg.getContext('2d');
        var gr = b.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W * 0.7);
        gr.addColorStop(0, mix(P.bg, P.c[2], 0.25)); gr.addColorStop(1, P.bg);
        b.fillStyle = gr; b.fillRect(0, 0, W, H);
        var sprites = [], i; for (i = 0; i < P.c.length; i++) sprites.push(glowSprite(P.c[i], 128));
        var orbs = [];
        for (i = 0; i < 26; i++) orbs.push({ s: sprites[i % sprites.length], x: rnd(0, W), y: rnd(0, H), r: rnd(30, 170), ph: rnd(0, TAU), sx: rnd(0.00005, 0.00018), sy: rnd(0.00005, 0.00018), a: rnd(0.25, 0.6) });
        return { bg: bg, orbs: orbs };
      },
      draw: function (g, S, P, t) {
        g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
        g.drawImage(S.bg, 0, 0);
        g.globalCompositeOperation = 'lighter';
        for (var i = 0; i < S.orbs.length; i++) {
          var o = S.orbs[i];

  newPairCode();
  function pairingOpen() {
    if (!ALLOWED_CHAT_IDS.length && !pairedChats.length) return true;   // first setup: code is on screen
    return Date.now() < pairOpenUntil;
  }

  function loadPaired() {
    try { return JSON.parse(localStorage.getItem('pairedChats') || '[]'); } catch (e) { return []; }
  }
  function savePaired(list) {
    try { localStorage.setItem('pairedChats', JSON.stringify(list)); } catch (e) {}
  }
  var pairedChats = loadPaired();

  function isAllowed(chatId) {
    return ALLOWED_CHAT_IDS.indexOf(chatId) !== -1 || pairedChats.indexOf(chatId) !== -1;
  }
  function updatePairLabel() {
    var botReady = !!BOT_TOKEN;
    var needPair = botReady && !ALLOWED_CHAT_IDS.length && !pairedChats.length;
    $('pair').textContent = needPair ? 'לחיבור טלגרם שלחו ל' + (botName ? '-@' + botName : 'בוט') + ': /pair ' + pairCode : '';
  }

  function api(method, params, cb, timeoutMs) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', API + method, true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = timeoutMs || 15000;
    xhr.onload = function () {
      var res = null;
      try { res = JSON.parse(xhr.responseText); } catch (e) {}
      if (cb) cb(res && res.ok ? null : (res || { description: 'bad response' }), res && res.result);
    };
    xhr.onerror = xhr.ontimeout = function () { if (cb) cb({ description: 'network' }); };
    xhr.send(JSON.stringify(params || {}));
  }

  function reply(chatId, text) { api('sendMessage', { chat_id: chatId, text: text }); }

  function showPhoto(chatId, fileId, caption) {
    api('getFile', { file_id: fileId }, function (err, file) {
      if (err || !file) { reply(chatId, 'לא הצלחתי לטעון את התמונה'); return; }
      addShareItem({ type: 'image', url: FILE_API + file.file_path, caption: caption || '' });
      reply(chatId, 'מוצג על המסך ✅ (' + shareItems.length + ' פריטים)\n/clock חזרה לשעון');
    });
  }

  function showVideo(chatId, v, caption) {
    if (v.file_size && v.file_size > 20 * 1024 * 1024) {
      reply(chatId, 'הסרטון גדול מ-20MB, וטלגרם לא מאפשר לבוטים להוריד קבצים כאלה. שלחו גרסה קצרה או דחוסה יותר.');
      return;
    }
    api('getFile', { file_id: v.file_id }, function (err, file) {
      if (err || !file) { reply(chatId, 'לא הצלחתי לטעון את הסרטון'); return; }
      var item = { type: 'video', url: FILE_API + file.file_path, caption: caption || '', thumb: '' };
      var th = v.thumbnail || v.thumb;
      var done = function () {
        addShareItem(item);
        reply(chatId, 'הסרטון מוצג ✅ (' + shareItems.length + ' פריטים)\n' + (videoSound ? '/mute השתקה' : '/sound הפעלת סאונד'));
      };
      if (!th) return done();
      api('getFile', { file_id: th.file_id }, function (e2, tf) { if (!e2 && tf) item.thumb = FILE_API + tf.file_path; done(); });
    });
  }

  var HELP_TEXT =
    'שלחו תמונה, סרטון (עד 20MB) או טקסט חופשי (למשל תפריט), והוא יוצג על המסך.\n' +
    'כמה תמונות ברצף יתחלפו כל ' + (SHARE_ROTATE_MS / 1000) + ' שניות.\n\n' +
    '/clock חזרה לשעון וניקוי\n' +
    '/show הצגה מחדש של הפריטים האחרונים\n' +
    '/next פריט הבא\n' +
    '/undo מחיקת הפריט האחרון\n' +
    '/sound /mute סאונד לסרטונים\n\n' +
    'רקע: /mix תמונות ויצירות · /photos · /art · /live אמנות חיה';

  function handleMessage(msg) {
    var chatId = msg.chat.id;
    var text = (msg.text || '').trim();

    if (text.indexOf('/pair') === 0) {
      if ((pairFailsByChat[chatId] || 0) >= PAIR_MAX_FAILS) return;      // locked out, stay silent
      if (!pairingOpen()) {
        reply(chatId, 'החיבור סגור. לחצו על הכפתור האדום בשלט הטלוויזיה ונסו שוב.');
        return;
      }
      if (text.split(/\s+/)[1] === pairCode) {
        if (pairedChats.indexOf(chatId) === -1) pairedChats.push(chatId);
        savePaired(pairedChats);
        newPairCode(); pairOpenUntil = 0;                                 // one code, one pairing
        updatePairLabel();
        reply(chatId, 'מחובר לטלוויזיה 🎉\n\n' + HELP_TEXT);
        toast('טלגרם מחובר ✅', 3000);
      } else {
        pairFailsByChat[chatId] = (pairFailsByChat[chatId] || 0) + 1;
        if (++pairFails >= PAIR_MAX_FAILS) { newPairCode(); updatePairLabel(); }
        reply(chatId, 'קוד שגוי. הקוד העדכני מוצג על מסך הטלוויזיה.');
      }
      return;
    }
    if (!isAllowed(chatId)) {
      if (text === '/start' || text === '/help') reply(chatId, 'שלחו /pair עם הקוד שמופיע בטלוויזיה.');
      return;                                                             // ignore strangers
    }

    if (msg.photo && msg.photo.length) {
      showPhoto(chatId, msg.photo[msg.photo.length - 1].file_id, msg.caption);
    } else if (msg.document && /^image\//.test(msg.document.mime_type || '')) {
      showPhoto(chatId, msg.document.file_id, msg.caption);   // "send as file" = full quality
    } else if (msg.video || msg.animation || msg.video_note) {
      showVideo(chatId, msg.video || msg.animation || msg.video_note, msg.caption);
    } else if (msg.document && /^video\//.test(msg.document.mime_type || '')) {
      showVideo(chatId, msg.document, msg.caption);
    } else if (text === '/sound' || text === '/mute') {
      videoSound = text === '/sound';
      $('shareVideo').muted = !videoSound;
      reply(chatId, videoSound ? 'סאונד מופעל 🔊' : 'סאונד מושתק 🔇');
    } else if (text === '/clock' || text === '/stop') {
      exitShare(true); reply(chatId, 'חזרה לשעון 🕐');
    } else if (text === '/show') {
      if (shareItems.length) { enterShare(); reply(chatId, 'מוצג ✅'); } else reply(chatId, 'אין פריטים להצגה');
    } else if (text === '/next') {
      if (shareItems.length) { shareIndex = (shareIndex + 1) % shareItems.length; renderShare(); }
    } else if (text === '/undo') {
      shareItems.pop();
      if (!shareItems.length) { exitShare(true); reply(chatId, 'אין עוד פריטים, חזרה לשעון'); }
      else { shareIndex = shareItems.length - 1; renderShare(); reply(chatId, 'נמחק. נשארו ' + shareItems.length); }
    } else if (/^\/(mix|photos|art|live)$/.test(text)) {
      applyMode(text.slice(1)); reply(chatId, 'מצב: ' + MODE_NAMES[MODE]);
    } else if (text === '/start' || text === '/help') {
      reply(chatId, HELP_TEXT);
    } else if (text && text.charAt(0) !== '/') {
      addShareItem({ type: 'text', text: text });
      reply(chatId, 'הטקסט מוצג ✅');
    }
  }

  function poll() {
    api('getUpdates', { offset: updateOffset, timeout: 30, allowed_updates: ['message'] },
      function (err, updates) {
        if (err) {
          if (err.error_code === 409) toast('לבוט מוגדר webhook. יש להסיר אותו (deleteWebhook)', 5000);
          setTimeout(poll, 5000);
          return;
        }
        for (var i = 0; i < updates.length; i++) {
          updateOffset = updates[i].update_id + 1;
          if (updates[i].message) {
            try { handleMessage(updates[i].message); } catch (e) { console.log(e); }
          }
        }
        poll();
      }, 40000);
  }

  function startBot() {
    updatePairLabel();
    if (!BOT_TOKEN) return;   // bot not configured
    api('getMe', {}, function (err, me) { if (!err && me && me.username) { botName = me.username; updatePairLabel(); } });
    poll();
  }

  /* ======================= Remote control ======================= */
  function registerKeys() {
    if (!hasTizen || !tizen.tvinputdevice) return;
    var keys = ['MediaPlayPause', 'MediaPlay', 'MediaPause', 'ColorF0Red', 'ColorF1Green', 'Info'];
    for (var i = 0; i < keys.length; i++) {
      try { tizen.tvinputdevice.registerKey(keys[i]); } catch (e) {}
    }
  }
  function exitApp() {
    releaseScreen();
    if (hasTizen) { try { tizen.application.getCurrentApplication().exit(); return; } catch (e) {} }
    window.close();
  }
  var helpOpen = false;
  var HELP_KEYS = [['◀ ▶', 'התמונה הקודמת או הבאה'], ['▲ ▼', 'בהירות'], ['OK', 'הצגה או הסתרה של שניות'],
                   ['ירוק', 'החלפת סוג הרקע'], ['Play / Pause', 'עצירת ההחלפה האוטומטית'], ['Back', 'יציאה, או חזרה לשעון מתוכן שנשלח']];
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  function openHelp(openPairing) {
    if (openPairing && BOT_TOKEN) pairOpenUntil = Date.now() + PAIR_WINDOW_MS;
    var keys = $('helpKeys'), bot = $('helpBot'), i;
    while (keys.firstChild) keys.removeChild(keys.firstChild);
    while (bot.firstChild) bot.removeChild(bot.firstChild);
    for (i = 0; i < HELP_KEYS.length; i++) {
      var row = el('div', 'hrow');
      row.appendChild(el('span', 'hkey', HELP_KEYS[i][0])); row.appendChild(el('span', 'hdesc', HELP_KEYS[i][1]));
      keys.appendChild(row);
    }
    function line(parts) {               // strings are plain text, arrays are highlighted
      var d = el('div');
      for (var k = 0; k < parts.length; k++) d.appendChild(typeof parts[k] === 'string' ? document.createTextNode(parts[k]) : el('b', '', parts[k][0]));
      bot.appendChild(d);
    }
    if (!BOT_TOKEN) {
      line(['כדי לשלוח תמונות, סרטונים וטקסט מהטלפון, מגדירים בוט טלגרם בקובץ config.js. ההסבר נמצא ב-README של הפרויקט.']);
    } else {
      line(botName ? ['שלחו ל-', ['@' + botName], ' תמונה, סרטון או טקסט, והם יוצגו כאן במסך מלא.']
                   : ['שלחו לבוט תמונה, סרטון או טקסט, והם יוצגו כאן במסך מלא.']);
      if (pairingOpen()) line(['חיבור טלפון חדש: שלחו לבוט ', ['/pair ' + pairCode], ' (הקוד בתוקף ל-5 דקות).']);
      line(['פקודות: ', ['/clock'], ' חזרה לשעון, ', ['/undo'], ' מחיקת האחרון, ', ['/sound'], ' סאונד לסרטונים, ', ['/mix'], ' ', ['/photos'], ' ', ['/art'], ' ', ['/live'], ' סוג הרקע.']);
    }
    helpOpen = true;
    $('help').classList.add('open'); $('toast').classList.remove('show');
  }
  function closeHelp() { helpOpen = false; $('help').classList.remove('open'); }

  document.addEventListener('keydown', function (e) {
    if (helpOpen) { closeHelp(); e.preventDefault(); return; }
    switch (e.keyCode) {
      case 10009: case 27:                 // Back / Esc
        if (shareOn) exitShare(false); else exitApp();
        break;
      case 37: case 39:                    // Left / Right
        var step = e.keyCode === 39 ? 1 : -1;
        if (shareOn && shareItems.length) {
          shareIndex = (shareIndex + step + shareItems.length) % shareItems.length; renderShare();
        } else {
          if (MODE === 'live') toast(setArt(step), 2500); else if (step > 0) nextPhoto(); else prevPhoto();
          startTimers();
        }
        break;
      case 38: case 40:                    // Up / Down
        var dk = MODE === 'live' ? 'live' : 'photo';
        dim[dk] = Math.round((e.keyCode === 38 ? Math.max(0, dim[dk] - 0.1) : Math.min(0.8, dim[dk] + 0.1)) * 10) / 10;
        try { localStorage.setItem('dim', JSON.stringify(dim)); } catch (e2) {}
        applyDim();
        toast('בהירות ' + Math.round((1 - dim[dk]) * 100) + '%');
        break;
      case 13:                             // OK
        if (!shareOn && shareItems.length) { enterShare(); break; }
        showSecs = !showSecs; renderClock();
        toast(showSecs ? 'הצגת שניות' : 'הסתרת שניות');
        break;
      case 10252: case 415: case 19:       // Play/Pause
        paused = !paused;
        toast(paused ? 'החלפה אוטומטית מושהית' : 'החלפה אוטומטית פעילה');
        break;
      case 404:                            // Green = change mode
        cycleMode();
        break;
      case 403: case 457:                  // Red / Info (also opens Telegram pairing for 5 minutes)
        openHelp(true);
        break;
      default:
        return;
    }
    e.preventDefault();
  });

  /* ======================= Lifecycle ======================= */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { releaseScreen(); stopArt(); }
    else { keepScreenOn(); moveClock(); if (!shareOn && MODE === 'live') startArt(); }
  });
  window.addEventListener('unload', releaseScreen);

  window.onload = function () {
    keepScreenOn();
    setInterval(keepScreenOn, POWER_REFRESH_MS);
    registerKeys();
    setArt(0, Math.floor(Math.random() * SCENES.length));
    requestAnimationFrame(frame);
    applyMode(MODE);
    tick();
    moveClock();
    startTimers();
    startBot();
    toast('הכפתור האדום או Info: הסבר ועזרה', 7000);
  };
})();
</script>
</body>
</html>
