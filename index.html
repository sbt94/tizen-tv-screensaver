<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>TV Screensaver</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff; cursor: none;
    font-family: "SamsungOne", "Samsung Sans", "Helvetica Neue", Arial, sans-serif;
  }

  /* ---------- Generative art (2 canvases for crossfade) ---------- */
  .art {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity 3s ease-in-out;
  }
  .art.visible { opacity: 1; }
  /* ---------- Photo mode (Chromecast style) ---------- */
  .photo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 2.5s ease-in-out; overflow: hidden; }
  .photo.visible { opacity: 1; }
  .pblur { position: absolute; top: -5%; left: -5%; width: 110%; height: 110%; background-size: cover; background-position: center; filter: blur(50px) brightness(0.5); }
  .pimg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-position: center; background-repeat: no-repeat; }
  .pimg.cover { background-size: cover; animation: kenburns 70s ease-out forwards; }
  .pimg.contain { background-size: contain; top: 4%; height: 92%; }
  @keyframes kenburns { from { transform: scale(1.0) translate(0, 0); } to { transform: scale(1.12) translate(-2%, -1%); } }
  #scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 38%; display: none;
           background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0)); }
  #credit { position: absolute; right: 6%; bottom: 9%; display: none; text-align: right; max-width: 45%;
            unicode-bidi: plaintext; text-shadow: 0 2px 12px rgba(0,0,0,0.6); transition: opacity 1.5s, transform 12s ease-in-out; }
  #creditTitle { font-size: 34px; font-weight: 400; }
  #creditSub { font-size: 24px; opacity: 0.75; margin-top: 6px; }
  body.photomode #scrim, body.photomode #credit { display: block; }
  body.photomode #clock { left: 6% !important; top: auto !important; bottom: 8%; transform: none; text-align: left;
                          transition: transform 12s ease-in-out, opacity 0.8s; }
  body.photomode #time { font-size: 120px; font-weight: 300; }
  body.photomode #time .sec { font-size: 40px; }
  body.photomode #date { font-size: 36px; margin-top: 8px; text-align: left; }
  body.nocredit #credit { display: none !important; }

  #dim { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000; opacity: 0.2; transition: opacity 0.6s; }

  /* ---------- Clock ---------- */
  #clock {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    text-align: center; direction: ltr;
    transition: left 12s ease-in-out, top 12s ease-in-out, color 20s linear, opacity 0.8s;
    text-shadow: 0 4px 30px rgba(0,0,0,0.45);
    white-space: nowrap;
  }
  #time { font-size: 210px; font-weight: 200; letter-spacing: 4px; line-height: 1; }
  #time .sec { font-size: 70px; opacity: 0.6; margin-left: 12px; vertical-align: top; }
  #time .colon { animation: blink 2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  #date { margin-top: 18px; font-size: 48px; font-weight: 300; opacity: 0.85; unicode-bidi: plaintext; }

  /* ---------- Settings panel and exit dialog ---------- */
  .overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .card { background: rgba(22,24,32,0.96); border-radius: 28px; padding: 44px 56px; box-shadow: 0 20px 80px rgba(0,0,0,0.6); }
  #settingsCard { width: 1000px; }
  .card h1 { font-size: 46px; font-weight: 300; margin-bottom: 26px; }
  .row { display: flex; align-items: center; justify-content: space-between; height: 78px; padding: 0 28px;
         border-radius: 16px; font-size: 32px; }
  .row .val { opacity: 0.75; white-space: nowrap; }
  .row .arr { display: inline-block; width: 44px; text-align: center; visibility: hidden; }
  .row.sel { background: #ffffff; color: #10131a; }
  .row.sel .val { opacity: 1; font-weight: 500; }
  .row.sel .arr { visibility: visible; }
  .hint { margin-top: 26px; font-size: 24px; opacity: 0.6; text-align: center; }
  .about { margin-top: 10px; font-size: 20px; opacity: 0.45; text-align: center; direction: ltr; }
  #exitCard { text-align: center; min-width: 620px; }
  #exitCard h1 { margin-bottom: 36px; }
  .btn { display: inline-block; min-width: 220px; margin: 0 14px; padding: 18px 30px; border-radius: 14px;
         font-size: 32px; background: rgba(255,255,255,0.12); }
  .btn.sel { background: #ffffff; color: #10131a; font-weight: 500; }
  #helpCard { width: 1100px; }
  .hrow { display: flex; align-items: center; height: 70px; font-size: 32px; }
  .hkey { flex: 0 0 300px; font-weight: 500; direction: ltr; text-align: start; }
  .hdesc { opacity: 0.85; }
  .hnote { margin-top: 22px; font-size: 26px; line-height: 1.5; opacity: 0.7; }
  .row .go { opacity: 0.6; }
  body.rtl .overlay, body.rtl #toast { direction: rtl; }
  body.rtl .hkey { text-align: right; }

  /* ---------- Toast ---------- */
  #toast {
    position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); border-radius: 16px; padding: 18px 36px;
    font-size: 28px; line-height: 1.6; opacity: 0; transition: opacity 0.5s; text-align: center; white-space: nowrap;
    z-index: 30;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
  <canvas class="art" id="artA"></canvas>
  <canvas class="art" id="artB"></canvas>
  <div class="photo" id="phA"><div class="pblur"></div><div class="pimg"></div></div>
  <div class="photo" id="phB"><div class="pblur"></div><div class="pimg"></div></div>
  <div id="dim"></div>
  <div id="scrim"></div>
  <div id="credit"><div id="creditTitle"></div><div id="creditSub"></div></div>

  <div id="clock">
    <div id="time"></div>
    <div id="date"></div>
  </div>

  <div class="overlay" id="settings">
    <div class="card" id="settingsCard">
      <h1 id="settingsTitle"></h1>
      <div id="settingsRows"></div>
      <div class="hint" id="settingsHint"></div>
      <div class="about">v1.0.0 · Photos: Wikimedia Commons · Paintings: Cleveland Museum of Art, Wikimedia Commons</div>
    </div>
  </div>

  <div class="overlay" id="help">
    <div class="card" id="helpCard">
      <h1 id="helpTitle"></h1>
      <div id="helpRows"></div>
      <div class="hnote" id="helpNote"></div>
      <div class="hint" id="helpClose"></div>
    </div>
  </div>

  <div class="overlay" id="exitDlg">
    <div class="card" id="exitCard">
      <h1 id="exitTitle"></h1>
      <span class="btn" id="exitYes"></span><span class="btn" id="exitNo"></span>
    </div>
  </div>

  <div id="toast"></div>

<script>
(function () {
  'use strict';

  /* ======================= Settings (saved on the TV) ======================= */
  var DEFAULTS = { mode: 'mix', minutes: 1, seconds: true, h24: true, lang: 'en', credits: true, fill: true, dim: 0.2 };
  var settings = (function () {
    var s = {}, saved = {}, k;
    try { saved = JSON.parse(localStorage.getItem('settings') || '{}') || {}; } catch (e) {}
    for (k in DEFAULTS) s[k] = (typeof saved[k] === typeof DEFAULTS[k]) ? saved[k] : DEFAULTS[k];
    if (['mix', 'photos', 'art', 'live'].indexOf(s.mode) === -1) s.mode = DEFAULTS.mode;
    if (['en', 'he'].indexOf(s.lang) === -1) s.lang = DEFAULTS.lang;
    s.minutes = Math.min(120, Math.max(1, s.minutes));
    s.dim = Math.min(0.85, Math.max(0, s.dim));
    return s;
  })();
  function saveSettings() { try { localStorage.setItem('settings', JSON.stringify(settings)); } catch (e) {} }

  var MODE = settings.mode;
  var WIKI_CATEGORIES = ['Featured_pictures_of_landscapes', 'Featured_pictures_of_mountains', 'Featured_pictures_of_coasts',
                         'Featured_pictures_of_volcanoes', 'Featured_pictures_of_islands', 'Featured_pictures_of_landscapes'];
  var WIKI_ART_CATEGORIES = ['Featured_pictures_of_paintings_from_France', 'Featured_pictures_of_paintings_from_Italy',
                             'Featured_pictures_of_paintings_from_Spain', 'Featured_pictures_of_art'];
  var ART_FPS            = 30;
  var MOVE_INTERVAL_MS   = 45 * 1000;      // clock shift (anti burn-in)
  var POWER_REFRESH_MS   = 5 * 60 * 1000;
  function photoInterval() { return settings.minutes * 60 * 1000; }
  function liveInterval()  { return Math.max(2, settings.minutes) * 60 * 1000; }

  var CLOCK_COLORS = ['#ffffff', '#f3f6ff', '#fff6ec', '#eefcf6', '#fdf0f6'];

  /* ======================= Languages ======================= */
  var I18N = {
    en: {
      days: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
      months: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
      date: function (d, L) { return L.days[d.getDay()] + ', ' + L.months[d.getMonth()] + ' ' + d.getDate(); },
      mode: { mix: 'Photos and paintings', photos: 'Photos', art: 'Paintings', live: 'Live art' },
      brightness: 'Brightness', paused: 'Auto-rotation paused', resumed: 'Auto-rotation on',
      offline: 'No connection to the photo sources. Showing live art.',
      help: 'Press OK for settings and help',
      rowHelp: 'How to use', helpTitle: 'How to use', helpClose: 'Press any button to close',
      helpRows: [['OK', 'Open settings'], ['◀ ▶', 'Previous or next picture'], ['▲ ▼', 'Brightness'],
                 ['Play / Pause', 'Keep the current picture on screen'], ['Back', 'Exit']],
      helpNote: 'The clock moves a little every minute and the pictures change on their own, to protect the screen from burn-in. The screen stays on while the screensaver is open.',
      settings: 'Settings', hint: '▲ ▼ Select &nbsp;&nbsp; ◀ ▶ Change &nbsp;&nbsp; Back Close',
      rowMode: 'Background', rowMinutes: 'Change every', rowSeconds: 'Show seconds', rowFormat: 'Time format',
      rowLang: 'Language', rowCredits: 'Photo credits', rowFill: 'Fill the screen',
      on: 'On', off: 'Off', minute: '1 minute', minutes: function (n) { return n + ' minutes'; },
      h24: '24-hour', h12: '12-hour', exitQ: 'Exit the screensaver?', exit: 'Exit', cancel: 'Cancel'
    },
    he: {
      days: ['יום ראשון', 'יום שני', 'יום שלישי', 'יום רביעי', 'יום חמישי', 'יום שישי', 'שבת'],
      months: ['בינואר', 'בפברואר', 'במרץ', 'באפריל', 'במאי', 'ביוני', 'ביולי', 'באוגוסט', 'בספטמבר', 'באוקטובר', 'בנובמבר', 'בדצמבר'],
      date: function (d, L) { return L.days[d.getDay()] + ', ' + d.getDate() + ' ' + L.months[d.getMonth()]; },
      mode: { mix: 'תמונות וציורים', photos: 'תמונות', art: 'ציורים', live: 'אמנות חיה' },
      brightness: 'בהירות', paused: 'ההחלפה האוטומטית מושהית', resumed: 'ההחלפה האוטומטית פעילה',
      offline: 'אין חיבור למקורות התמונות. מוצגת אמנות חיה.',
      help: 'לחצו OK להגדרות ולהסבר',
      rowHelp: 'איך משתמשים', helpTitle: 'איך משתמשים', helpClose: 'לחצו על כפתור כלשהו לסגירה',
      helpRows: [['OK', 'פתיחת ההגדרות'], ['◀ ▶', 'התמונה הקודמת או הבאה'], ['▲ ▼', 'בהירות'],
                 ['Play / Pause', 'השארת התמונה הנוכחית על המסך'], ['Back', 'יציאה']],
      helpNote: 'השעון זז מעט כל דקה והתמונות מתחלפות מעצמן, כדי להגן על המסך מצריבה. המסך נשאר דלוק כל עוד שומר המסך פתוח.',
      settings: 'הגדרות', hint: '▲ ▼ בחירה &nbsp;&nbsp; ◀ ▶ שינוי &nbsp;&nbsp; Back סגירה',
      rowMode: 'רקע', rowMinutes: 'החלפה כל', rowSeconds: 'הצגת שניות', rowFormat: 'תצוגת שעה',
      rowLang: 'שפה', rowCredits: 'קרדיט לתמונות', rowFill: 'תמונה על מסך מלא',
      on: 'פועל', off: 'כבוי', minute: 'דקה', minutes: function (n) { return n + ' דקות'; },
      h24: '24 שעות', h12: '12 שעות', exitQ: 'לצאת משומר המסך?', exit: 'יציאה', cancel: 'ביטול'
    }
  };
  function T() { return I18N[settings.lang]; }

  /* ======================= State ======================= */
  var hasTizen = typeof window.tizen !== 'undefined';
  var paused = false;
  var artIndex = -1;
  var bgTimer, moveTimer, toastTimer;

  var $ = function (id) { return document.getElementById(id); };

  /* ======================= Screen power ======================= */
  function keepScreenOn() {
    if (!hasTizen || !tizen.power) return;
    try { tizen.power.request('SCREEN', 'SCREEN_NORMAL'); }
    catch (e) { console.log('power.request failed: ' + e.message); }
  }
  function releaseScreen() {
    if (!hasTizen || !tizen.power) return;
    try { tizen.power.release('SCREEN'); } catch (e) {}
  }

  /* ======================= Clock ======================= */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function renderClock() {
    var d = new Date(), h = d.getHours(), suffix = '';
    if (!settings.h24) { suffix = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; }
    var html = (settings.h24 ? pad(h) : h) + '<span class="colon">:</span>' + pad(d.getMinutes());
    if (settings.seconds) html += '<span class="sec">' + pad(d.getSeconds()) + '</span>';
    else if (suffix) html += '<span class="sec">' + suffix + '</span>';
    $('time').innerHTML = html;
    $('date').textContent = T().date(d, T());
  }
  function snapClock() {               // reposition at once (no 12-second glide) when the layout changes
    var c = $('clock'), cr = $('credit');
    c.style.transition = cr.style.transition = 'none';
    moveClock();
    void c.offsetWidth;
    c.style.transition = cr.style.transition = '';
  }
  function tick() {
    renderClock();
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  function moveClock() {
    var clock = $('clock');
    if (document.body.classList.contains('photomode')) {      // Chromecast layout: small jitter vs burn-in
      clock.style.transform = 'translate(' + Math.round(rnd(-40, 40)) + 'px,' + Math.round(rnd(-30, 20)) + 'px)';
      $('credit').style.transform = 'translate(' + Math.round(rnd(-40, 40)) + 'px,' + Math.round(rnd(-30, 20)) + 'px)';
      clock.style.color = '#fff';
      return;
    }
    clock.style.transform = '';
    clock.style.left = (30 + Math.random() * 40) + '%';
    clock.style.top  = (28 + Math.random() * 44) + '%';
    clock.style.color = CLOCK_COLORS[Math.floor(Math.random() * CLOCK_COLORS.length)];
  }

  /* ======================= Generative art ======================= */
  var W = 960, H = 540;              // rendered at half-res, scaled up by CSS (fast + soft)
  var TAU = Math.PI * 2;
  var canvases = [$('artA'), $('artB')];
  for (var ci = 0; ci < 2; ci++) { canvases[ci].width = W; canvases[ci].height = H; }
  var activeCanvas = 0, running = [], lastFrame = 0, artStopped = false;

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function hex2rgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgba(h, a) { var c = hex2rgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function mix(h1, h2, t) {
    var a = hex2rgb(h1), b = hex2rgb(h2);
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
  }
  function offscreen(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function glowSprite(color, r) {
    var c = offscreen(r * 2, r * 2), g = c.getContext('2d');
    var gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, rgba(color, 1)); gr.addColorStop(0.35, rgba(color, 0.45)); gr.addColorStop(1, rgba(color, 0));
    g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2);
    return c;
  }

  // Perlin noise 2D
  var perm = [];
  (function () {
    var p = [], i;
    for (i = 0; i < 256; i++) p[i] = i;
    for (i = 255; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = p[i]; p[i] = p[j]; p[j] = t; }
    for (i = 0; i < 512; i++) perm[i] = p[i & 255];
  })();
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function lerp(t, a, b) { return a + t * (b - a); }
  function grad(h, x, y) { switch (h & 3) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; default: return -x - y; } }
  function noise(x, y) {
    var X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    var u = fade(x), v = fade(y), a = perm[X] + Y, b = perm[X + 1] + Y;
    return lerp(v, lerp(u, grad(perm[a], x, y), grad(perm[b], x - 1, y)),
                   lerp(u, grad(perm[a + 1], x, y - 1), grad(perm[b + 1], x - 1, y - 1)));
  }

  var PALETTES = [
    { name: 'Neon dusk',   bg: '#07040f', c: ['#ff2e88', '#ff9a3c', '#7b2cff', '#00e5ff'] },
    { name: 'Nordic',      bg: '#020812', c: ['#3cffb4', '#2bd9ff', '#8a5cff', '#c6ff6b'] },
    { name: 'Ember',       bg: '#0c0402', c: ['#ff5e1a', '#ffb347', '#ff2d55', '#ffd9a0'] },
    { name: 'Deep sea',    bg: '#010814', c: ['#00b4d8', '#48cae4', '#90e0ef', '#5e60ce'] },
    { name: 'Orchid',      bg: '#0a0410', c: ['#e056fd', '#f78fb3', '#7f5af0', '#ffd6ff'] },
    { name: 'Gold leaf',   bg: '#060505', c: ['#d4a373', '#ffd166', '#f4f1de', '#e76f51'] }
  ];

  var SCENES = [
    /* 1. Silk flow field */
    { name: { en: 'Silk', he: 'משי' }, init: function (g, P) {
        g.fillStyle = P.bg; g.fillRect(0, 0, W, H);
        var parts = [];
        for (var i = 0; i < 1100; i++) parts.push({ x: rnd(0, W), y: rnd(0, H), l: rnd(50, 300), c: i % P.c.length });
        return { p: parts, scale: rnd(0.0025, 0.0045), twist: rnd(1.2, 2.4) };
      },
      draw: function (g, S, P, t) {
        g.globalCompositeOperation = 'source-over';
        g.fillStyle = rgba(P.bg, 0.035); g.fillRect(0, 0, W, H);
        g.lineWidth = 1.1; g.globalAlpha = 0.55;
        var o = t * 0.00004;
        for (var c = 0; c < P.c.length; c++) {
          g.strokeStyle = P.c[c]; g.beginPath();
          for (var i = c; i < S.p.length; i += P.c.length) {
            var p = S.p[i];
            var a = noise(p.x * S.scale + o, p.y * S.scale - o) * TAU * S.twist;
            var nx = p.x + Math.cos(a) * 1.6, ny = p.y + Math.sin(a) * 1.6;
            g.moveTo(p.x, p.y); g.lineTo(nx, ny);
            p.x = nx; p.y = ny; p.l--;
            if (p.l < 0 || nx < 0 || nx > W || ny < 0 || ny > H) { p.x = rnd(0, W); p.y = rnd(0, H); p.l = rnd(50, 300); }
          }
          g.stroke();
        }
        g.globalAlpha = 1;
      } },

    /* 2. Aurora over mountains */
    { name: { en: 'Aurora', he: 'זוהר צפוני' }, init: function (g, P) {
        var sky = offscreen(W, H), s = sky.getContext('2d');
        var gr = s.createLinearGradient(0, 0, 0, H);
        gr.addColorStop(0, '#01020a'); gr.addColorStop(1, mix(P.bg, P.c[3], 0.25));
        s.fillStyle = gr; s.fillRect(0, 0, W, H);
        for (var i = 0; i < 350; i++) { s.fillStyle = 'rgba(255,255,255,' + rnd(0.2, 0.9) + ')'; s.fillRect(rnd(0, W), rnd(0, H * 0.8), rnd(0.6, 1.6), rnd(0.6, 1.6)); }
        var hills = offscreen(W, H), h = hills.getContext('2d');
        for (var L = 0; L < 2; L++) {
          h.fillStyle = L ? '#000' : '#05060b'; h.beginPath(); h.moveTo(0, H);
          for (var x = 0; x <= W; x += 6) h.lineTo(x, H * (0.78 + L * 0.08) - (noise(x * 0.006, L * 7) + 0.5) * (70 - L * 30));
          h.lineTo(W, H); h.fill();
        }
        var rib = [];
        for (var r = 0; r < 3; r++) {
          var sp = offscreen(1, 256), sg = sp.getContext('2d'), lg = sg.createLinearGradient(0, 0, 0, 256), col = P.c[r];
          lg.addColorStop(0, rgba(col, 0)); lg.addColorStop(0.8, rgba(col, 0.5)); lg.addColorStop(0.97, rgba('#ffffff', 0.8)); lg.addColorStop(1, rgba(col, 0));
          sg.fillStyle = lg; sg.fillRect(0, 0, 1, 256);
          rib.push({ sp: sp, base: H * rnd(0.32, 0.55), amp: rnd(60, 130), seed: rnd(0, 100), speed: rnd(0.6, 1.4) });
        }
        return { sky: sky, hills: hills, rib: rib };
      },
      draw: function (g, S, P, t) {

  function loadCommons(cat, photos, cb) {
    var letter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
    getJSON('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
            '&generator=categorymembers&gcmtype=file&gcmtitle=Category:' + cat +
            (photos ? '&gcmlimit=40&gcmstartsortkeyprefix=' + letter : '&gcmlimit=100') +
            '&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=1920' +
            '&iiextmetadatafilter=Artist|ObjectName|ImageDescription', function (err, d) {

    while (box.firstChild) box.removeChild(box.firstChild);
    for (var i = 0; i < T().helpRows.length; i++) {
      var row = document.createElement('div'), k = document.createElement('span'), d = document.createElement('span');
      row.className = 'hrow'; k.className = 'hkey'; d.className = 'hdesc';
      k.textContent = T().helpRows[i][0]; d.textContent = T().helpRows[i][1];
      row.appendChild(k); row.appendChild(d); box.appendChild(row);
    }
    $('help').classList.add('open'); $('toast').classList.remove('show');
  }
  function closeHelp() { helpOpen = false; $('help').classList.remove('open'); }

  function renderExit() {
    $('exitTitle').textContent = T().exitQ;
    $('exitYes').textContent = T().exit; $('exitNo').textContent = T().cancel;
    $('exitYes').className = 'btn' + (exitChoice === 0 ? ' sel' : '');
    $('exitNo').className = 'btn' + (exitChoice === 1 ? ' sel' : '');
  }
  function openExit() { exitOpen = true; exitChoice = 1; renderExit(); $('exitDlg').classList.add('open'); }
  function closeExit() { exitOpen = false; $('exitDlg').classList.remove('open'); }

  /* ======================= Remote control ======================= */
  function registerKeys() {
    if (!hasTizen || !tizen.tvinputdevice) return;
    var keys = ['MediaPlayPause', 'MediaPlay', 'MediaPause', 'ColorF0Red', 'Info'];
    for (var i = 0; i < keys.length; i++) {
      try { tizen.tvinputdevice.registerKey(keys[i]); } catch (e) {}
    }
  }
  function exitApp() {
    releaseScreen();
    if (hasTizen) { try { tizen.application.getCurrentApplication().exit(); return; } catch (e) {} }
    window.close();
  }
  function showHint() { toast(T().help, 8000); }

  var KEY = { BACK: 10009, ESC: 27, LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, OK: 13 };

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;

    if (exitOpen) {
      if (k === KEY.LEFT || k === KEY.RIGHT) { exitChoice = 1 - exitChoice; renderExit(); }
      else if (k === KEY.OK) { if (exitChoice === 0) exitApp(); else closeExit(); }
      else if (k === KEY.BACK || k === KEY.ESC) closeExit();
      else return;
      e.preventDefault(); return;
    }
    if (helpOpen) { closeHelp(); e.preventDefault(); return; }
    if (settingsOpen) {
      if (k === KEY.UP) { rowIndex = (rowIndex - 1 + ROWS.length) % ROWS.length; renderSettings(); }
      else if (k === KEY.DOWN) { rowIndex = (rowIndex + 1) % ROWS.length; renderSettings(); }
      else if (k === KEY.LEFT || k === KEY.RIGHT) {
        var rtl = settings.lang === 'he', fwd = (k === KEY.RIGHT) !== rtl;
        changeSetting(fwd ? 1 : -1);
      }
      else if (k === KEY.OK && ROWS[rowIndex].action) ROWS[rowIndex].action();
      else if (k === KEY.OK || k === KEY.BACK || k === KEY.ESC) closeSettings();
      else return;
      e.preventDefault(); return;
    }

    switch (k) {
      case KEY.BACK: case KEY.ESC:
        openExit();
        break;
      case KEY.LEFT: case KEY.RIGHT:
        var step = k === KEY.RIGHT ? 1 : -1;
        if (MODE === 'live') toast(setArt(step), 2500); else if (step > 0) nextPhoto(); else prevPhoto();
        startTimers();
        break;
      case KEY.UP: case KEY.DOWN:
        settings.dim = Math.round((k === KEY.UP ? Math.max(0, settings.dim - 0.1) : Math.min(0.8, settings.dim + 0.1)) * 10) / 10;
        saveSettings(); applyDim();
        toast(T().brightness + ' ' + Math.round((1 - settings.dim) * 100) + '%');
        break;
      case KEY.OK:
        openSettings();
        break;
      case 10252: case 415: case 19:       // Play/Pause
        paused = !paused;
        toast(paused ? T().paused : T().resumed);
        break;
      case 403: case 457:                  // Red / Info
        openHelp();
        break;
      default:
        return;
    }
    e.preventDefault();
  });

  /* ======================= Lifecycle ======================= */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { releaseScreen(); stopArt(); }
    else { keepScreenOn(); moveClock(); if (MODE === 'live') startArt(); }
  });
  window.addEventListener('unload', releaseScreen);

  window.onload = function () {
    keepScreenOn();
    setInterval(keepScreenOn, POWER_REFRESH_MS);
    registerKeys();
    applyLanguage();
    applyCredits();
    setArt(0, Math.floor(Math.random() * SCENES.length));
    requestAnimationFrame(frame);
    applyMode(MODE);
    tick();
    moveClock();
    showHint();
  };
})();
</script>
</body>
</html>
